services:
  hub:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: doorbellhub
    restart: unless-stopped
    # mDNS multicast only works with host networking (Linux). On Windows/macOS
    # Docker Desktop cannot do multicast — run the hub natively there instead,
    # or rely on CAM_IP in .env for manual camera connection.
    network_mode: host
    env_file: .env
    volumes:
      - ./data:/hub/data          # events, snapshots, sqlite db
      - ./tools/models:/hub/tools/models:ro
